name: Deploy Function App

# The dashboard already deploys itself (azure-static-web-apps-*.yml). This does
# the same for the backend, so a merge to main updates both halves together and
# nobody has to remember `func azure functionapp publish` again.
# Manual only until after the Aug 19 demo.
#
# A bad deploy takes the whole API down — we did exactly that once already, and
# the app served 404s until it was republished by hand. Deploying on every push
# means that can happen while nobody is watching, including an hour before the
# demo. Until then, deploy deliberately: Actions tab -> Deploy Function App ->
# Run workflow. The verify step below still proves the API answers afterwards.
#
# To restore automatic deploys after the demo, put this back above
# workflow_dispatch:
#
#   push:
#     branches: [main]
#     paths:
#       - "function_app.py"
#       - "db.py"
#       - "blob.py"
#       - "vision.py"
#       - "agent.py"
#       - "host.json"
#       - "requirements.txt"
#       - ".github/workflows/deploy-functions.yml"
on:
  workflow_dispatch:

# Two deploys running at once is how you get a half-published app. Queue the
# second one instead of cancelling the first: cancelling mid-publish is exactly
# the state that left the API serving 404s, so unlike the dashboard workflow
# this one must never interrupt a run in flight.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  AZURE_FUNCTIONAPP_NAME: func-baettledger
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No local pip install. Dependencies are built remotely by Oryx, which is
      # what `func azure functionapp publish --build remote` does and is the only
      # method proven to work on this app. Vendoring them locally and skipping
      # Oryx produced a package that deployed "successfully" and then 404'd.
      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          # The repo root also holds the React dashboard and the Pi code. Without
          # this the whole tree is zipped and shipped to Azure.
          respect-funcignore: true

      # A deploy that reports success while the app 404s is the failure mode we
      # actually hit, so prove the API answers before calling this green.
      - name: Verify the API is alive
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" \
              "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health")
            echo "attempt $i: /api/health -> $code"
            if [ "$code" = "200" ]; then echo "API is live"; exit 0; fi
            sleep 20
          done
          echo "::error::/api/health never returned 200 after deploy"
          exit 1
